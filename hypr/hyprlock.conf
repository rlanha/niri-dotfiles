# hyprlock - solarized dark theme
# https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock/

background {
    monitor =
    path = ~/.local/share/wallpapers/gotham-forest.png
    blur_passes = 2
    blur_size = 4
    brightness = 0.7
    contrast = 0.9
    saturation = 0.8
}

general {
    hide_cursor = true
    ignore_empty_input = true
    no_fade_in = false
    no_fade_out = false
    grace = 0
    disable_loading_bar = true
}

input-field {
    monitor =
    size = 250, 50
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.4
    dots_center = true
    outer_color = rgba(0, 0, 0, 0.2)
    inner_color = rgba(0, 43, 54, 0.9)
    font_color = rgb(188, 195, 195)
    fade_on_empty = true
    placeholder_text = <i>Password...</i>
    hide_input = false
    rounding = 12
    position = 0, -80
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "<span foreground='#ffb52a'>$(date +'%I:%M %p')</span>"
    font_family = "JetBrainsMono Nerd Font"
    font_size = 80
    color = rgba(188, 195, 195, 1.0)
    position = 0, 130
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%A, %d %B %Y')"
    font_family = "JetBrainsMono Nerd Font"
    font_size = 22
    color = rgba(188, 195, 195, 0.8)
    position = 0, 30
    halign = center
    valign = center
}
